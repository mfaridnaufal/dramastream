16px;font-size:12px;line-height:1.6;margin-bottom:30px}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:25px 0 16px}.sectionhead h2{font-size:24px;margin:0}.count{color:#a6a0ad;font-size:13px}.chips{display:flex;gap:9px;overflow:auto;padding-bottom:16px}.chip{background:#211f27;border:1px solid #39313d;color:#ddd8e3;padding:9px 16px;border-radius:99px;white-space:nowrap}.chip.active{background:#622041;border-color:#f02a83;color:#fff}.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:18px;padding-bottom:110px}.tile{min-width:0;cursor:pointer}.poster{height:auto;aspect-ratio:2/3;border-radius:13px;position:relative;overflow:hidden;background:linear-gradient(160deg,var(--a),var(--b));box-shadow:inset 0 0 90px #0006}.poster:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 66% 28%,#fff8 0%,transparent 40%),linear-gradient(0deg,#08050bdc 0%,transparent 62%)}.poster .orb{position:absolute;width:70%;height:44%;left:15%;top:15%;border-radius:50%;background:radial-gradient(circle at 50% 40%,#f7c8aa,#ad637d 43%,#231526 73%);filter:blur(1px);opacity:.68;box-shadow:0 0 50px #ffd3a033}.poster .person{position:absolute;width:50%;height:66%;left:12%;top:24%;background:linear-gradient(125deg,#25141f,#775168 50%,#120d18);border-radius:48% 48% 10% 10%;clip-path:polygon(28% 0,66% 0,83% 15%,80% 35%,100% 57%,100% 100%,0 100%,0 58%,18% 34%,15% 15%);filter:drop-shadow(10px 2px 8px #0009)}.poster .person.two{left:50%;top:30%;width:42%;height:58%;transform:scaleX(-1);opacity:.8;background:linear-gradient(125deg,#190f19,#bb8b88 55%,#21121f)}.poster .mist{position:absolute;inset:40% 0 0;background:linear-gradient(transparent,#100813d9)}.poster .posterTitle{position:absolute;bottom:17px;left:12px;right:12px;font-family:Georgia,serif;font-weight:900;font-size:clamp(17px,1.7vw,27px);line-height:.98;text-shadow:0 2px 8px #000}.tag{position:absolute;top:10px;left:10px;font-size:9px;font-weight:900;letter-spacing:.7px;background:#09090ec9;border-radius:5px;padding:6px 7px}.tile h3{font-size:14px;margin:11px 0 4px;line-height:1.3}.meta{color:#a7a0ad;font-size:12px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#15131bed;border-top:1px solid #342b39;display:flex;justify-content:center;gap:clamp(28px,10vw,145px);z-index:35;padding:11px 16px 13px;backdrop-filter:blur(18px)}.nav{background:none;border:0;color:#b9b2c0;font-size:11px;display:grid;gap:3px;justify-items:center}.nav b{font-size:20px;font-weight:400}.nav.active{color:#ff54a0}.overlay{position:fixed;inset:0;z-index:50;background:#050409e9;display:none;overflow:auto;padding:35px 18px 95px}.overlay.show{display:block}.modal{max-width:880px;margin:auto;background:#19161f;border:1px solid #40313e;border-radius:18px;padding:24px}.close{float:right;background:#302735;border:0;color:white;border-radius:10px;padding:9px 14px}.detail{display:grid;grid-template-columns:220px 1fr;gap:26px;margin-top:35px}.detail .poster{width:220px}.detail h1{font-size:34px;line-height:1.1}.detail p{color:#c2b9c6;line-height:1.8}.episodegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:9px;margin-top:18px}.ep{background:#29232e;border:1px solid #443647;border-radius:8px;padding:13px 8px;color:white}.ep:hover{border-color:#f02a83}.empty{text-align:center;color:#aaa;padding:80px 20px;grid-column:1/-1}.player{aspect-ratio:16/9;background:radial-gradient(circle,#4a2243,#08070d 65%);display:grid;place-content:center;text-align:center;border-radius:12px;margin:18px 0}.player b{font-size:50px}.player small{color:#c9b4c4}.footnote{font-size:12px;color:#b5a5b2;line-height:1.6}.hidden{display:none!important}@media(max-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.toplinks{display:none}}@media(max-width:600px){.wrap{padding:0 15px}.topin{min-height:62px}.brand{font-size:22px}.search{width:48vw;padding:10px}.hero{padding:34px 24px;min-height:280px;margin:15px 0 20px}.hero h1{letter-spacing:-1px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.poster .posterTitle{font-size:23px}.sectionhead h2{font-size:21px}.detail{grid-template-columns:1fr}.detail .poster{width:175px}.detail h1{font-size:27px}.modal{padding:17px}.bottom{justify-content:space-around;gap:0}.nav{min-width:62px}}

.poster img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;z-index:1}.poster:has(img):before{z-index:2;pointer-events:none}.poster:has(img) .posterTitle,.poster:has(img) .tag{z-index:3}.status{padding:14px 16px;border:1px solid #443347;border-radius:10px;background:#211925;color:#e8d7e5;margin-bottom:18px;font-size:13px}.player video{width:100%;max-height:72vh;border-radius:12px;background:#000}.player:has(video){display:block;background:#000}.source{font-size:12px;color:#c6b6c5;margin-top:10px}
.tile .meta{line-height:1.5}.primary[href]{display:inline-block;margin-top:12px}.tag{max-width:90%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.vertical-player{display:flex;justify-content:center;background:#000;border-radius:12px;margin:18px 0}.vertical-player video{width:auto;max-width:100%;height:min(68vh,720px);aspect-ratio:9/16}.player-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}.player-actions label{font-size:13px}.ep.current{border-color:#f02a83;background:#622041}</style></head><body><header class="top"><div class="wrap topin"><a href="#" class="brand" onclick="goHome(event)">Drama<span>Stream</span></a><div class="toplinks"><a href="#catalog">Jelajahi</a><a href="#" onclick="showFavorites(event)">Favorit</a></div><input id="search" class="search" placeholder="⌕  Cari drama..." aria-label="Cari drama"></div></header><main class="wrap"><section class="hero"><div><div class="eyebrow">DRAMA PENDEK • CERITA TANPA BATAS</div><h1>Setiap cerita punya<br>rahasianya sendiri.</h1><p>Temukan drama romantis, misteri, fantasi, dan keluarga dalam satu tempat.</p><div class="actions"><button class="primary" onclick="document.getElementById('catalog').scrollIntoView()">Jelajahi Drama →</button><button class="secondary" onclick="showFavorites()">♡ Favorit Saya</button></div></div></section><div class="notice">DramaStream V5 Hybrid · Putar konten berlisensi di sini atau kunjungi platform resmi.</div><section id="catalog"><div class="sectionhead"><h2>Jelajahi Drama</h2><span class="count" id="count"></span></div><div class="chips" id="chips"></div><div id="status" class="status">Memuat katalog…</div><div class="grid" id="grid"></div></section></main><nav class="bottom"><button class="nav active" onclick="goHome()"><b>⌂</b>Beranda</button><button class="nav" onclick="document.getElementById('search').focus()"><b>⌕</b>Cari</button><button class="nav" onclick="showHistory()"><b>◷</b>Riwayat</button><button class="nav" onclick="showAccount()"><b>♙</b>Akun</button></nav><div id="overlay" class="overlay"><div class="modal"><button class="close" onclick="closeModal()">✕ Tutup</button><div id="modalContent"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script><script>
// Konfigurasi publik: isi hanya publishable key (sb_publishable_...), JANGAN secret/service_role.
const SUPABASE_URL = 'https://jixnkswvapwshprwqkox.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_XS8EqiErKwMplA4tzmrfvA_bcoXtZne";
const $=id=>document.getElementById(id);
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const validUrl=s=>{try{let u=new URL(s);return ['https:','http:'].includes(u.protocol)?u.href:null}catch{return null}};
const stored=k=>{try{return JSON.parse(localStorage.getItem(k)||'[]')}catch{return []}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
let db=null,dramas=[],genre='Semua',mode='all',episodesCache=new Map();
const todayISO=()=>new Date().toISOString().slice(0,10);
const canStream=d=>d.rights_status==='licensed'&&d.allow_public_catalog===true&&d.streaming_allowed===true&&(!d.license_expires_at||d.license_expires_at>=todayISO());
const officialLink=d=>validUrl(d.official_url);
const actionLabel=d=>canStream(d)?'▶ Tonton di DramaStream':officialLink(d)?'↗ Platform Resmi':'Info Katalog';
function status(msg){$('status').textContent=msg;$('status').classList.remove('hidden')}
function poster(d){let img=validUrl(d.poster_url);return `<div class="poster" style="--a:#6a355c;--b:#171321">${img?`<img loading="lazy" src="${safe(img)}" alt="Poster ${safe(d.title)}" onerror="this.remove()">`:'<div class="orb"></div><div class="person"></div><div class="person two"></div><div class="mist"></div>'}<span class="tag">${safe(d.provider_name||'DRAMASTREAM')}</span><div class="posterTitle">${safe(d.title)}</div></div>`}
function render(){const q=$('search').value.toLocaleLowerCase('id');const list=dramas.filter(d=>(genre==='Semua'||d.genre===genre)&&d.title.toLocaleLowerCase('id').includes(q)&&(mode!=='fav'||stored('ds-v5-fav').includes(d.id)));$('count').textContent=list.length+' judul';$('grid').innerHTML=list.length?list.map(d=>`<article class="tile" role="button" tabindex="0" onclick="detail('${d.id}')" onkeydown="if(event.key==='Enter')detail('${d.id}')">${poster(d)}<h3>${safe(d.title)}</h3><div class="meta">${safe(d.genre||'Drama')} · ${safe(actionLabel(d))}</div></article>`).join(''):'<div class="empty">Belum ada drama berlisensi yang tersedia.</div>';const genres=['Semua',...new Set(dramas.map(d=>d.genre).filter(Boolean))];$('chips').innerHTML=genres.map((g,i)=>`<button class="chip ${g===genre?'active':''}" onclick="selectGenre(${i})">${safe(g)}</button>`).join('')}
function selectGenre(i){genre=['Semua',...new Set(dramas.map(d=>d.genre).filter(Boolean))][i];render()}
function show(html){stopPlayer();$('modalContent').innerHTML=html;$('overlay').classList.add('show');document.body.style.overflow='hidden'}
function closeModal(){stopPlayer();$('overlay').classList.remove('show');document.body.style.overflow=''}
async function loadCatalog(){if(!window.supabase){status('Pustaka Supabase gagal dimuat. Periksa koneksi internet.');render();return}if(!SUPABASE_PUBLISHABLE_KEY || !SUPABASE_PUBLISHABLE_KEY.startsWith('sb_publishable_')){status('Belum terhubung: masukkan Supabase Publishable Key pada index.html.');render();return}try{db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);const {data,error}=await db.from('dramas').select('id,title,synopsis,genre,poster_url,provider_id,rights_status,allow_public_catalog,streaming_allowed,official_url,license_expires_at,providers(name)').eq('allow_public_catalog',true).limit(500);if(error)throw error;dramas=(data||[]).map(d=>({...d,provider_name:d.providers?.name||'Mitra berizin'}));$('status').classList.add('hidden');if(!dramas.length)status('Koneksi berhasil. Belum ada judul yang disetujui untuk katalog publik.');render()}catch(e){status('Katalog gagal dimuat: '+(e?.message||'Terjadi kesalahan koneksi'));render()}}
async function detail(id){const d=dramas.find(x=>x.id===id);if(!d)return;const f=stored('ds-v5-fav').includes(id);show(`<div class="detail">${poster(d)}<div><div class="eyebrow">${safe(d.genre||'DRAMA')} · ${safe(d.provider_name)}</div><h1>${safe(d.title)}</h1><p>${safe(d.synopsis||'Sinopsis belum tersedia.')}</p><div class="actions"><button class="secondary" onclick="toggleFav('${d.id}')">${f?'♥ Hapus Favorit':'♡ Tambah Favorit'}</button></div></div></div>${canStream(d)?'<h2>Daftar Episode</h2><p>Memuat episode…</p>':officialLink(d)?`<p><a class="primary" target="_blank" rel="noopener noreferrer" href="${safe(officialLink(d))}">↗ Tonton di platform resmi</a></p><p class="footnote">Tautan eksternal. Video tidak dihosting oleh DramaStream.</p>`:'<p class="footnote">Belum tersedia untuk ditonton. Menunggu izin distribusi atau tautan resmi.</p>'}`);if(!canStream(d))return;try{const {data,error}=await db.from('episodes').select('*').eq('drama_id',id).eq('is_published',true).order('episode_number',{ascending:true}).limit(300);if(error)throw error;episodesCache.set(id,data||[]);if(!$('overlay').classList.contains('show'))return;const els=$('modalContent');const list=(data||[]).map(ep=>`<button class="ep" onclick="playEpisode('${id}',${Number(ep.episode_number)})">Ep. ${Number(ep.episode_number)}</button>`).join('');els.innerHTML=`<div class="detail">${poster(d)}<div><div class="eyebrow">${safe(d.genre||'DRAMA')} · ${safe(d.provider_name)}</div><h1>${safe(d.title)}</h1><p>${safe(d.synopsis||'Sinopsis belum tersedia.')}</p><button class="secondary" onclick="toggleFav('${id}')">${f?'♥ Hapus Favorit':'♡ Tambah Favorit'}</button></div></div><h2>Daftar Episode</h2><div class="episodegrid">${list||'<p>Belum ada episode yang dipublikasikan.</p>'}</div>`}catch(e){$('modalContent').insertAdjacentHTML('beforeend',`<p class="footnote">Gagal memuat episode: ${safe(e.message)}</p>`)}}
function toggleFav(id){let a=stored('ds-v5-fav');a=a.includes(id)?a.filter(x=>x!==id):[...a,id];save('ds-v5-fav',a);detail(id);render()}
let hlsPlayer=null;
function stopPlayer(){if(hlsPlayer){hlsPlayer.destroy();hlsPlayer=null}const v=$('ds-video');if(v){v.pause();v.removeAttribute('src');v.load()}}
function episodeItem(id,num){const ep=(episodesCache.get(id)||[]).find(e=>Number(e.episode_number)===num);const url=ep&&validUrl(ep.playback_url||ep.video_url||ep.stream_url);return url?{ep,url}:null}
function neighbor(id,num,dir){const nums=(episodesCache.get(id)||[]).map(e=>Number(e.episode_number)).filter(Number.isFinite).sort((a,b)=>dir*(a-b));return nums.find(n=>dir*(n-num)>0&&episodeItem(id,n))??null}
function playEpisode(id,num){
const d=dramas.find(x=>x.id===id),item=episodeItem(id,num);
if(!d||!canStream(d)){alert('Hak streaming tidak tersedia atau sudah berakhir.');return}
if(!item){alert('Episode belum memiliki video yang tersedia.');return}
const url=item.url,isHls=/\.m3u8(?:[?#]|$)/i.test(url),isFile=/\.(mp4|webm|ogg)(?:[?#]|$)/i.test(url);
if(!isHls&&!isFile){alert('Format belum didukung. Gunakan MP4, WebM, OGG, atau HLS .m3u8.');return}
let history=stored('ds-v5-history').filter(x=>x.id!==id);save('ds-v5-history',[{id,ep:num},...history].slice(0,30));
const prev=neighbor(id,num,-1),next=neighbor(id,num,1),auto=localStorage.getItem('ds-v5-autonext')!=='false';
const epButtons=(episodesCache.get(id)||[]).map(e=>{const n=Number(e.episode_number);return `<button class="ep ${n===num?'current':''}" ${episodeItem(id,n)?`onclick="playEpisode('${id}',${n})"`:'disabled'}>Ep. ${n}</button>`}).join('');
show(`<div class="eyebrow">${safe(d.title)} · EPISODE ${num}</div><div class="vertical-player"><video id="ds-video" controls playsinline preload="metadata" controlsList="nodownload"></video></div><div class="player-actions"><button class="secondary" ${prev===null?'disabled':''} onclick="playEpisode('${id}',${prev})">← Sebelumnya</button><button class="secondary" ${next===null?'disabled':''} onclick="playEpisode('${id}',${next})">Berikutnya →</button><label><input id="ds-autonext" type="checkbox" ${auto?'checked':''} onchange="localStorage.setItem('ds-v5-autonext',String(this.checked))"> Auto Next</label></div><p id="player-message" class="footnote"></p><button class="secondary" onclick="detail('${id}')">← Daftar Episode</button><h3>Daftar Episode</h3><div class="episodegrid">${epButtons}</div><p class="footnote">Hanya untuk video berizin. Pengamanan lisensi memerlukan pemeriksaan di server, bukan hanya browser.</p>`);
const video=$('ds-video'),msg=$('player-message');
video.addEventListener('ended',()=>{const n=neighbor(id,num,1);if($('ds-autonext')?.checked&&n!==null&&canStream(d))playEpisode(id,n);else msg.textContent='Episode selesai.'});
video.addEventListener('error',()=>msg.textContent='Video gagal dimuat. Periksa URL, CORS dan izin akses.');
if(isFile||video.canPlayType('application/vnd.apple.mpegurl')){video.src=url;video.load()}
else if(window.Hls&&Hls.isSupported()){hlsPlayer=new Hls();hlsPlayer.loadSource(url);hlsPlayer.attachMedia(video);hlsPlayer.on(Hls.Events.ERROR,(_,e)=>{if(e.fatal)msg.textContent='HLS gagal dimuat. Periksa playlist atau CORS.'})}
else msg.textContent='Browser tidak mendukung HLS.';
}
function showFavorites(e){e?.preventDefault();mode='fav';genre='Semua';render();closeModal();$('catalog').scrollIntoView()}
function goHome(e){e?.preventDefault();mode='all';genre='Semua';$('search').value='';render();closeModal();window.scrollTo({top:0,behavior:'smooth'})}
function showHistory(){const a=stored('ds-v5-history');show(`<h2>Riwayat Menonton</h2>${a.length?a.map(x=>`<p><button class="secondary" onclick="detail('${x.id}')">${safe(dramas.find(d=>d.id===x.id)?.title||'Drama')} — Episode ${Number(x.ep)}</button></p>`).join(''):'<p>Belum ada riwayat episode.</p>'}`)}
function showAccount(){show('<h2>Akun DramaStream</h2><p>Login belum diaktifkan. Favorit dan riwayat tersimpan hanya pada browser ini.</p>')}
$('search').addEventListener('input',render);$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});loadCatalog();
</script></body></html>
