<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DramaStream — Drama Pendek</title><style>:root{font-family:system-ui,Arial;background:#101014;color:#fff}*{box-sizing:border-box}body{margin:0;padding-bottom:85px}header{display:flex;align-items:center;justify-content:space-between;padding:22px 5%;background:#17171d;position:sticky;top:0;z-index:2}.logo{font-size:25px;font-weight:900;background:linear-gradient(90deg,#ff4287,#b83bff);color:transparent;background-clip:text}input{background:#292931;border:1px solid #444;color:white;padding:12px;border-radius:12px;width:min(300px,48vw)}main{max-width:1100px;margin:auto;padding:26px 5%}.hero{padding:35px 25px;border-radius:18px;background:linear-gradient(120deg,#542343,#22162d);margin-bottom:30px}h1{font-size:clamp(26px,5vw,44px);margin:0 0 10px}.muted{color:#b9b8c0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:18px}.tile{background:#202027;border-radius:14px;overflow:hidden;cursor:pointer;border:1px solid #333}.poster{aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;font-size:60px;background:linear-gradient(145deg,#65375c,#28203d)}.tile h3{font-size:15px;margin:12px}.tile p{font-size:12px;color:#aaa;margin:0 12px 14px}button{background:linear-gradient(90deg,#e32674,#9838ef);border:0;border-radius:10px;color:white;padding:13px 18px;font-weight:bold;cursor:pointer}.back{background:#333;margin-bottom:18px}.episodes{display:flex;flex-wrap:wrap;gap:9px;margin-top:15px}.episodes button{min-width:55px}video{width:100%;max-height:65vh;background:#000;border-radius:12px}nav{position:fixed;bottom:0;background:#191920;border-top:1px solid #35353b;display:flex;justify-content:space-around;width:100%;padding:14px}nav a{color:#ccc;text-decoration:none}.notice{padding:14px;background:#28212b;border-radius:12px;color:#e6c6db;margin:18px 0}</style></head><body><header><div class="logo">DramaStream</div><input id="search" placeholder="Cari drama..." aria-label="Cari drama"></header><main id="app"></main><nav><a href="#/">⌂ Beranda</a><a href="#/">⌕ Cari</a><a href="#/history">◷ Riwayat</a></nav><script>
// DATA DEMO. Ganti dengan hasil API mitra yang memberi hak distribusi komersial.
const dramas=[{id:'senja',title:'Janji di Ujung Senja',genre:'Romantis',synopsis:'Kisah fiksi contoh tentang dua sahabat yang bertemu kembali.',emoji:'🌆',episodes:[{title:'Episode 1',src:''},{title:'Episode 2',src:''},{title:'Episode 3',src:''}]},{id:'rahasia',title:'Rahasia Kota Malam',genre:'Misteri',synopsis:'Sebuah misteri baru muncul di tengah kota.',emoji:'🌙',episodes:[{title:'Episode 1',src:''},{title:'Episode 2',src:''}]},{id:'mahkota',title:'Mahkota Terakhir',genre:'Fantasi',synopsis:'Petualangan fantasi di kerajaan rekaan.',emoji:'👑',episodes:[{title:'Episode 1',src:''}]}];
const app=document.getElementById('app');const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function home(q=''){const found=dramas.filter(d=>(d.title+' '+d.genre).toLowerCase().includes(q.toLowerCase()));app.innerHTML=`<section class="hero"><h1>Drama pendek favoritmu</h1><p>Temukan cerita baru, pilih episode, dan lanjutkan tontonan.</p><div class="notice">Katalog ini berisi judul fiksi untuk demonstrasi. Video belum tersedia sampai sumber berlisensi terhubung.</div></section><h2>Jelajahi Drama</h2><div class="grid">${found.map(d=>`<article class="tile" data-id="${d.id}"><div class="poster">${d.emoji}</div><h3>${escapeHTML(d.title)}</h3><p>${d.episodes.length} episode · ${escapeHTML(d.genre)}</p></article>`).join('')}</div>`;app.querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>location.hash='/drama/'+el.dataset.id)}
function detail(id){const d=dramas.find(x=>x.id===id);if(!d){home();return}app.innerHTML=`<button class="back" id="back">← Kembali</button><div class="poster" style="max-width:240px;border-radius:14px">${d.emoji}</div><h1>${escapeHTML(d.title)}</h1><p class="muted">${d.episodes.length} episode · ${escapeHTML(d.genre)}</p><p>${escapeHTML(d.synopsis)}</p><button id="play">▶ Putar Ep. 1</button><h2>Episode</h2><div class="episodes">${d.episodes.map((e,i)=>`<button data-ep="${i}">${i+1}</button>`).join('')}</div><section id="player"></section>`;document.getElementById('back').onclick=()=>location.hash='/';document.getElementById('play').onclick=()=>play(d,0);app.querySelectorAll('[data-ep]').forEach(b=>b.onclick=()=>play(d,Number(b.dataset.ep)))}
function play(d,i){localStorage.setItem('lastWatched',JSON.stringify({id:d.id,episode:i}));const e=d.episodes[i];document.getElementById('player').innerHTML=`<h2>${escapeHTML(e.title)}</h2>${e.src?`<video controls playsinline src="${escapeHTML(e.src)}"></video>`:'<div class="notice">Episode ini belum memiliki video berlisensi. Admin perlu menghubungkan URL video resmi sebelum dapat diputar.</div>'}`;document.getElementById('player').scrollIntoView({behavior:'smooth'})}
function route(){const path=location.hash.slice(1);if(path.startsWith('/drama/'))detail(path.split('/')[2]);else if(path==='/history'){const x=JSON.parse(localStorage.getItem('lastWatched')||'null');if(x&&dramas.some(d=>d.id===x.id)){detail(x.id);play(dramas.find(d=>d.id===x.id),x.episode)}else app.innerHTML='<h2>Belum ada riwayat menonton</h2>'}else home(document.getElementById('search').value)}document.getElementById('search').addEventListener('input',e=>{location.hash='/';home(e.target.value)});addEventListener('hashchange',route);route();
</script></body></html>
