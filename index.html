<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101014"><title>DramaStream — Drama Pendek Favorit</title><style>
:root{font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;color:#f5f3f7;background:#101014}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #f83e99;outline-offset:3px}header{position:sticky;top:0;z-index:5;background:#151419ee;backdrop-filter:blur(18px);border-bottom:1px solid #ffffff12}.head{max-width:1190px;margin:auto;padding:15px 22px;display:flex;align-items:center;gap:24px}.logo{border:0;background:none;color:#fff;font-size:25px;font-weight:900;letter-spacing:-1px;padding:0}.logo span{background:linear-gradient(95deg,#ff377c,#a83df3);background-clip:text;color:transparent}.search{margin-left:auto;display:flex;align-items:center;background:#29272f;border:1px solid #ffffff13;border-radius:11px;padding:0 13px;width:min(320px,40vw)}.search input{background:transparent;border:0;color:#fff;padding:12px 8px;width:100%;outline:0}.search input::placeholder{color:#a5a1aa}.tag{font-size:11px;font-weight:700;letter-spacing:.07em;color:#ffc1df;border:1px solid #ff4a9955;background:#c4286330;padding:7px 10px;border-radius:99px}.wrap{max-width:1190px;margin:auto;padding:24px 22px 110px}.hero{min-height:315px;position:relative;overflow:hidden;border-radius:22px;background:radial-gradient(ellipse at 80% 40%,#b4328660,transparent 48%),linear-gradient(115deg,#3b1730,#211727 65%,#17141c);padding:45px 44px;display:flex;align-items:center}.hero:after{content:'✦';position:absolute;right:10%;top:0;font-size:280px;color:#ffffff0a;transform:rotate(15deg);pointer-events:none}.hero-content{position:relative;z-index:1;max-width:620px}.eyebrow{color:#ffa4cb;font-weight:800;letter-spacing:.15em;font-size:12px}.hero h1{font-size:clamp(32px,5vw,57px);line-height:1.07;letter-spacing:-2px;margin:13px 0}.hero p{color:#d9c8d4;line-height:1.6;max-width:520px}.primary{background:linear-gradient(95deg,#f52770,#9e35eb);color:white;border:0;border-radius:10px;padding:13px 20px;font-weight:800}.ghost{background:#ffffff15;color:#fff;border:1px solid #ffffff30;border-radius:10px;padding:12px 17px;font-weight:700}.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.notice{margin:22px 0;color:#c8bdc7;background:#241d28;border:1px solid #463247;padding:12px 16px;border-radius:10px;font-size:13px}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:30px 0 15px}.sectionhead h2{font-size:23px;letter-spacing:-.5px;margin:0}.muted{color:#aaa4b0;font-size:13px}.filters{display:flex;gap:9px;overflow:auto;padding:0 0 12px}.chip{border:1px solid #3b3540;background:#232127;color:#ddd7e0;border-radius:99px;padding:9px 17px;white-space:nowrap}.chip.active{border-color:#e73989;background:#9c225c66;color:white}.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:17px}.tile{background:transparent;border:0;text-align:left;color:#fff;padding:0;min-width:0}.poster{position:relative;aspect-ratio:2/3;overflow:hidden;border-radius:13px;border:1px solid #ffffff20;display:flex;flex-direction:column;justify-content:space-between;padding:12px;background:linear-gradient(155deg,var(--a),var(--b));box-shadow:inset 0 0 75px #0005}.poster:before{content:'';position:absolute;width:130%;height:55%;left:-20%;top:25%;background:radial-gradient(ellipse,#ffffff28,transparent 65%);transform:rotate(-25deg)}.poster:after{content:attr(data-symbol);position:absolute;top:25%;left:0;width:100%;text-align:center;font-size:clamp(54px,7vw,100px);opacity:.73;filter:drop-shadow(0 12px 16px #0005)}.poster .ribbon{position:relative;z-index:1;align-self:flex-start;background:#0009;border:1px solid #ffffff30;border-radius:6px;padding:5px 7px;font-size:10px;font-weight:800}.poster .arttitle{position:relative;z-index:1;font-family:Georgia,serif;font-size:clamp(18px,2vw,26px);font-weight:900;line-height:1.02;text-shadow:0 2px 12px #000;max-width:95%}.tile h3{font-size:14px;line-height:1.35;margin:10px 0 5px}.tile p{color:#aaa3ad;font-size:12px;margin:0}.tile:hover .poster{transform:translateY(-4px);border-color:#ff4a9c;transition:.2s}.empty{text-align:center;color:#bdb2c0;padding:65px 10px;border:1px dashed #554352;border-radius:14px}.back{background:none;border:0;color:#f6acd3;padding:6px 0;margin-bottom:17px}.detail{display:grid;grid-template-columns:minmax(180px,280px) 1fr;gap:32px;align-items:start}.detail .poster{width:100%}.detail h1{font-size:clamp(27px,4vw,46px);line-height:1.12;margin:6px 0 12px}.detail p{line-height:1.75;color:#c8c1cb}.meta{color:#bcb2bf;margin:15px 0}.episode-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;margin-top:18px}.episode{padding:14px 8px;background:#29252e;border:1px solid #423947;border-radius:9px;color:white}.episode:hover{background:#75345f}.player{margin-top:26px;aspect-ratio:16/9;border:1px solid #49364c;border-radius:17px;background:radial-gradient(circle at center,#5a254c,#121016 65%);display:flex;align-items:center;justify-content:center;text-align:center;padding:22px}.player strong{font-size:22px}.player p{max-width:480px;color:#d0c4d0;line-height:1.6}.account{max-width:660px;margin:auto;background:#211d25;border:1px solid #423743;border-radius:18px;padding:25px}.bottom{position:fixed;z-index:8;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#17161bee;backdrop-filter:blur(16px);border-top:1px solid #ffffff19}.bottom-inner{max-width:740px;width:100%;display:flex;justify-content:space-around}.navbtn{background:none;color:#aaa3ae;border:0;padding:12px 20px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px}.navbtn b{font-size:22px;font-weight:400}.navbtn.on{color:#ff63ab}footer{color:#77717c;font-size:12px;text-align:center;padding:25px 0} @media(max-width:850px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.episode-grid{grid-template-columns:repeat(6,1fr)}}@media(max-width:580px){.head{padding:12px 15px;gap:10px}.logo{font-size:21px}.tag{display:none}.search{width:45vw;padding:0 8px}.wrap{padding:15px 15px 105px}.hero{padding:28px 23px;min-height:280px}.hero h1{letter-spacing:-1px}.hero:after{right:-25%;font-size:220px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.poster{padding:8px;border-radius:9px}.poster .arttitle{font-size:17px}.poster:after{font-size:56px}.sectionhead h2{font-size:20px}.detail{grid-template-columns:115px 1fr;gap:15px}.detail h1{font-size:25px}.detail .arttitle{font-size:16px}.detail p{font-size:13px}.episode-grid{grid-template-columns:repeat(4,1fr)}.navbtn{padding:10px 9px}.player{aspect-ratio:4/3}}
</style></head><body><header><div class="head"><button class="logo" onclick="navigate('home')">Drama<span>Stream</span></button><span class="tag">DRAMA PENDEK</span><label class="search">⌕ <input id="search" placeholder="Cari drama..." aria-label="Cari drama"></label></div></header><main class="wrap" id="app"></main><nav class="bottom" aria-label="Navigasi utama"><div class="bottom-inner" id="nav"></div></nav><script>
const dramas=[{id:'senja',title:'Janji di Ujung Senja',genre:'Romantis',episodes:12,year:2026,symbol:'🌆',a:'#a94d69',b:'#2e1836',synopsis:'Pertemuan yang tak disengaja mengubah jalan hidup dua orang yang menyimpan rahasia masa lalu.'},{id:'malam',title:'Rahasia Kota Malam',genre:'Misteri',episodes:16,year:2026,symbol:'🌙',a:'#36527d',b:'#171a37',synopsis:'Seorang jurnalis muda menemukan petunjuk misterius yang membawanya ke sisi tersembunyi kota.'},{id:'mahkota',title:'Mahkota Terakhir',genre:'Fantasi',episodes:20,year:2026,symbol:'👑',a:'#8764b7',b:'#2b1d47',synopsis:'Pewaris takhta yang hilang harus memilih antara cinta dan tanggung jawab kerajaan.'},{id:'hujan',title:'Cinta Setelah Hujan',genre:'Romantis',episodes:18,year:2026,symbol:'🌧️',a:'#5c8095',b:'#30234d',synopsis:'Setelah perpisahan panjang, dua sahabat kembali bertemu di kota kecil tempat mereka tumbuh.'},{id:'waktu',title:'Melintasi Waktu',genre:'Fantasi',episodes:24,year:2026,symbol:'⌛',a:'#bc783a',b:'#372247',synopsis:'Sebuah jam tua membuka kesempatan untuk memperbaiki satu keputusan yang mengubah segalanya.'},{id:'bayang',title:'Di Balik Bayangan',genre:'Misteri',episodes:14,year:2026,symbol:'🗝️',a:'#49676a',b:'#211d35',synopsis:'Seorang penyelidik menemukan bahwa kasus terbarunya berkaitan dengan keluarganya sendiri.'},{id:'bintang',title:'Bintang di Hatiku',genre:'Romantis',episodes:22,year:2026,symbol:'✨',a:'#b85790',b:'#40204f',synopsis:'Penyanyi pemula dan produser musik bertemu di tengah perjalanan menuju impian masing-masing.'},{id:'samudra',title:'Legenda Samudra Biru',genre:'Fantasi',episodes:26,year:2026,symbol:'🌊',a:'#218b9e',b:'#17335b',synopsis:'Seorang pelaut menemukan peta menuju pulau yang hanya muncul setiap seratus tahun.'},{id:'pulang',title:'Jalan Menuju Pulang',genre:'Keluarga',episodes:10,year:2026,symbol:'🏡',a:'#8c795b',b:'#3b2830',synopsis:'Kisah keluarga yang belajar saling memahami setelah bertahun-tahun terpisah.'},{id:'surat',title:'Surat yang Tertinggal',genre:'Romantis',episodes:15,year:2026,symbol:'💌',a:'#bb6571',b:'#3c254b',synopsis:'Sepucuk surat lama membuka kembali cerita cinta yang belum selesai.'},{id:'kode',title:'Kode Tengah Malam',genre:'Misteri',episodes:19,year:2026,symbol:'🔍',a:'#486b94',b:'#211b37',synopsis:'Sebuah pesan terenkripsi membawa programmer muda ke teka-teki besar.'},{id:'pelangi',title:'Warna Pelangi',genre:'Keluarga',episodes:13,year:2026,symbol:'🌈',a:'#a56b88',b:'#41315d',synopsis:'Tiga saudara menemukan kembali arti rumah melalui perjalanan yang tidak terduga.'}];
let page='home',selected='Semua',query='',current=null;const app=document.getElementById('app');const read=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}};const save=(key,v)=>localStorage.setItem(key,JSON.stringify(v));let favorites=read('ds-favorites',[]),history=read('ds-history',[]);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function poster(d){return `<div class="poster" style="--a:${d.a};--b:${d.b}" data-symbol="${d.symbol}"><span class="ribbon">ORIGINAL DEMO</span><span class="arttitle">${esc(d.title)}</span></div>`}function tile(d){return `<button class="tile" onclick="navigate('detail','${d.id}')">${poster(d)}<h3>${esc(d.title)}</h3><p>${d.episodes} Episode · ${d.genre}</p></button>`}function filtered(){return dramas.filter(d=>(selected==='Semua'||d.genre===selected)&&(`${d.title} ${d.genre}`.toLowerCase().includes(query.toLowerCase())))}function catalog(){return `<div class="sectionhead"><h2>Jelajahi Drama</h2><span class="muted">${filtered().length} judul</span></div><div class="filters">${['Semua','Romantis','Misteri','Fantasi','Keluarga'].map(g=>`<button class="chip ${selected===g?'active':''}" onclick="choose('${g}')">${g}</button>`).join('')}</div>${filtered().length?`<div class="grid">${filtered().map(tile).join('')}</div>`:'<div class="empty">Drama tidak ditemukan. Coba kata kunci lain.</div>'}`}
function render(){document.getElementById('nav').innerHTML=[['home','⌂','Beranda'],['search','⌕','Cari'],['history','◷','Riwayat'],['account','♙','Akun']].map(([p,i,t])=>`<button class="navbtn ${page===p?'on':''}" onclick="navigate('${p}')"><b>${i}</b>${t}</button>`).join('');if(page==='home'||page==='search'){app.innerHTML=(page==='home'?`<section class="hero"><div class="hero-content"><div class="eyebrow">CERITA BARU SETIAP HARI</div><h1>Drama pendek,<br>cerita tak terlupakan.</h1><p>Temukan kisah romantis, misteri, fantasi, dan keluarga dalam satu tempat.</p><div class="hero-actions"><button class="primary" onclick="document.getElementById('catalog').scrollIntoView({behavior:'smooth'})">Jelajahi Drama →</button><button class="ghost" onclick="navigate('account')">Favorit Saya ♡</button></div></div></section><div class="notice">Versi demo: semua judul dan poster adalah fiksi. Video belum tersedia sampai konten berizin terhubung.</div><div id="catalog">`:'<div class="sectionhead"><h2>Cari Drama</h2></div><p class="muted">Ketik judul di kolom pencarian atas.</p><div id="catalog">')+catalog()+'</div>';return}if(page==='detail'){const d=dramas.find(x=>x.id===current);if(!d){navigate('home');return}app.innerHTML=`<button class="back" onclick="navigate('home')">← Kembali ke beranda</button><div class="detail">${poster(d)}<div><span class="eyebrow">${d.genre.toUpperCase()} · ${d.year}</span><h1>${esc(d.title)}</h1><div class="meta">★ Drama Demo &nbsp; · &nbsp; ${d.episodes} Episode</div><p>${esc(d.synopsis)}</p><div class="hero-actions"><button class="primary" onclick="episode('${d.id}',1)">▶ Putar Ep. 1</button><button class="ghost" onclick="toggleFavorite('${d.id}')">${favorites.includes(d.id)?'♥ Hapus Favorit':'♡ Tambah Favorit'}</button></div></div></div><div class="sectionhead"><h2>Daftar Episode</h2><span class="muted">${d.episodes} episode</span></div><div class="episode-grid">${Array.from({length:d.episodes},(_,i)=>`<button class="episode" onclick="episode('${d.id}',${i+1})">Ep. ${i+1}</button>`).join('')}</div><div id="player"></div>`;return}if(page==='history'){app.innerHTML=`<div class="sectionhead"><h2>Riwayat Menonton</h2></div><p class="muted">Episode yang pernah Anda pilih pada perangkat ini.</p>${history.length?`<div class="grid">${history.map(x=>dramas.find(d=>d.id===x.id)).filter(Boolean).map(tile).join('')}</div>`:'<div class="empty">Belum ada riwayat. Pilih episode drama untuk memulai.</div>'}`;return}if(page==='account'){app.innerHTML=`<div class="account"><h2>Akun & Favorit</h2><p class="muted">Versi demo belum memiliki sistem login. Favorit disimpan di browser perangkat Anda.</p><h3>♡ Drama Favorit</h3>${favorites.length?`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(115px,1fr))">${favorites.map(id=>dramas.find(d=>d.id===id)).filter(Boolean).map(tile).join('')}</div>`:'<div class="empty">Belum ada favorit.</div>'}<p class="muted" style="margin-top:28px">Untuk akun, video berlisensi, dan sinkronisasi otomatis, kita akan menambahkan backend pada tahap berikutnya.</p></div>`;return}}
function navigate(p,id){page=p;if(id)current=id;if(p==='search'){selected='Semua';setTimeout(()=>document.getElementById('search').focus(),0)}render();window.scrollTo({top:0,behavior:'instant'})}function choose(g){selected=g;render();document.getElementById('catalog')?.scrollIntoView({block:'start'})}function toggleFavorite(id){favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];save('ds-favorites',favorites);render()}function episode(id,n){history=[{id,n},...history.filter(x=>x.id!==id)].slice(0,20);save('ds-history',history);const d=dramas.find(x=>x.id===id);document.getElementById('player').innerHTML=`<div class="player"><div><div style="font-size:44px">▶</div><strong>${esc(d.title)} — Episode ${n}</strong><p>Video demonstrasi belum tersedia. Episode hanya dapat diputar setelah kita menghubungkan sumber streaming dengan izin penayangan yang sah.</p>${n<d.episodes?`<button class="ghost" onclick="episode('${id}',${n+1})">Lihat Episode ${n+1} →</button>`:''}</div></div>`;document.getElementById('player').scrollIntoView({behavior:'smooth',block:'center'})}document.getElementById('search').addEventListener('input',e=>{query=e.target.value;if(page!=='home'&&page!=='search')page='search';render()});render();
</script><footer>© 2026 DramaStream · Prototipe katalog fiksi · Konten berlisensi akan ditambahkan kemudian</footer></body></html>
